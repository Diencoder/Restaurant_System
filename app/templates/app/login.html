{%load static%}
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Login</title>
	<link href="{% static 'app/css/style.css'%}" rel="stylesheet"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<style>
		input{

		}
	</style>
</head>
<body style="background-image: url('{%static 'app/img/nhahang.jpg'%}');">
    <div class="Login">
        <main>
            <form method="POST" action=""> 
				{% csrf_token %}
                <input type="text" name="username" placeholder="Username" required><br><br>
                <input type="password" name="password" placeholder="Password" required><br><br>
		<label><input type="checkbox">Nhớ Mật Khẩu</label><br><br>
		<a href="#">Quên Mật Khẩu</a><br><br>
		
                <button type="submit" class="dangnhap">Login</button>
		<hr>
                <a href="{% url 'register' %}"><button type="button" class="dangki">Register</button></a>
            </form>
        </main>
    </div>
</body>
</html>
